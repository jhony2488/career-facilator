name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Versão do release (ex: v0.1.0)'
        required: false
        default: 'dev'

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: career-windows-x64.exe
            node-bin: node.exe
          - os: macos-latest
            asset: career-macos-arm64
            node-bin: node
          - os: macos-13
            asset: career-macos-x64
            node-bin: node
          - os: ubuntu-latest
            asset: career-linux-x64
            node-bin: node

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check tag matches package.json version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME diverge de package.json version $PKG — bump a versão antes de taggear."
            exit 1
          fi

      - run: npx tsc --noEmit
      - run: npm run test:unit

      - name: Bundle + SEA blob
        run: npm run bundle && npm run sea

      - name: Inject blob into binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item (Get-Command node).Source ${{ matrix.asset }}
          npx postject ${{ matrix.asset }} NODE_SEA_BLOB dist/bundle/sea-prep.blob `
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2

      - name: Inject blob into binary (macOS)
        if: runner.os == 'macOS'
        run: |
          cp "$(which node)" ${{ matrix.asset }}
          chmod +x ${{ matrix.asset }}
          npx postject ${{ matrix.asset }} NODE_SEA_BLOB dist/bundle/sea-prep.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2 \
            --macho-segment-name NODE_SEA
          codesign --remove-signature ${{ matrix.asset }} || true
          codesign --sign - ${{ matrix.asset }} || true

      - name: Inject blob into binary (Linux)
        if: runner.os == 'Linux'
        run: |
          cp "$(which node)" ${{ matrix.asset }}
          chmod +x ${{ matrix.asset }}
          npx postject ${{ matrix.asset }} NODE_SEA_BLOB dist/bundle/sea-prep.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2

      - name: Build runtime sidecar (playwright + browsers + tesseract + skills)
        run: npm run build:runtime

      - name: Package (zip completo + tarball do runtime)
        run: node scripts/package-release.mjs --asset ${{ matrix.asset }}

      - name: Smoke test binary
        shell: bash
        run: |
          mkdir -p smoke && cd smoke
          unzip -q ../dist/*.zip 2>/dev/null || tar -xf ../dist/*.zip 2>/dev/null || true
          BIN=$(find . -type f -name 'career-*' ! -name '*.zip' ! -name '*.tar.gz' | head -1)
          if [ -z "$BIN" ]; then BIN="../${{ matrix.asset }}"; fi
          chmod +x "$BIN" 2>/dev/null || true
          VERSION=$("$BIN" --version)
          echo "Binary version: $VERSION"
          "$BIN" discover --dry-run
          "$BIN" runtime status || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            ${{ matrix.asset }}

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist-release

      - name: Checksums
        run: |
          cd dist-release
          sha256sum career-*.zip career-runtime-*.tar.gz career-windows-x64.exe career-macos-* career-linux-x64 2>/dev/null > checksums.txt || sha256sum career-* > checksums.txt
          cat checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          generate_release_notes: true
          body: |
            Executáveis single-file do CareerFacilator AI — sem Node.js necessário.

            **Instalação (recomendado — pacote completo)**
            Baixe o `career-<os>-<arch>.zip` do seu sistema e descompacte: ele traz o executável + `career-runtime/` (Playwright + Chromium + pdf-parse + tesseract) + `skills/` + `.env.example`. Todos os recursos funcionam igual à instalação por código — autofill de formulários, fontes autenticadas (LinkedIn/Gupy), OCR de posts, leitura de PDF com camada de texto.

            - Windows: `career-windows-x64.zip` — o SmartScreen pode avisar (binário sem assinatura): "Mais informações → Executar mesmo assim"
            - macOS: `career-macos-arm64.zip` (Apple Silicon) ou `career-macos-x64.zip` (Intel) — `xattr -dr com.apple.quarantine <pasta>` p/ liberar exe + Chromium (Gatekeeper)
            - Linux: `career-linux-x64.zip` — `chmod +x`; o Chromium pode pedir libs de sistema (`npx playwright install-deps chromium` ou equivalente)

            **Só o binário** (`career-<os>-<arch>[.exe]` sozinho): roda discovery por APIs/RSS, triagem, e-mail, WhatsApp e fila de revisão; depois `career runtime setup` baixa `career-runtime-<os>-<arch>.tar.gz` e completa os recursos de browser/PDF/OCR ao lado do exe. Sem o runtime, formulários web degradam p/ e-mail, WhatsApp ou `NEEDS_HUMAN_INPUT`.

            **Configuração:** `career config init` cria `~/.careerfacilator/.env`; um `.env` com `CAREER_HOME=.` na pasta do exe mantém os dados portáteis ao lado dele (o `.env` da pasta do exe sobrepõe o do diretório de trabalho). Biblioteca de skills: pasta `skills/` já inclusa no zip. Detalhes completos: `tutorials/pt-BR/08-executavel-release.md` / `tutorials/en/08-release-executable.md`.
