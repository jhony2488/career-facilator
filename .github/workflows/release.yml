name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Versão do release (ex: v0.1.0)'
        required: false
        default: 'dev'

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: career-windows-x64.exe
          - os: macos-latest
            asset: career-macos-arm64
          - os: macos-15-intel
            asset: career-macos-x64
          - os: ubuntu-latest
            asset: career-linux-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Check tag matches package.json version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME diverge de package.json version $PKG — bump a versão antes de taggear."
            exit 1
          fi

      - run: npx tsc --noEmit
      - run: npm run test:unit

      - name: Linux Tauri deps (webkit2gtk etc.)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Um só build: o CLI SEA + runtime sidecar é insumo direto do Tauri —
      # dist/career-* + dist/career-runtime + dist/skills são staged como
      # externalBin/resources do app desktop (não existe artefato CLI solto).
      - name: Bundle + SEA blob + inject (dist/career-<os>-<arch>)
        run: npm run bundle && npm run sea && npm run inject -- --name ${{ matrix.asset }}

      - name: Build runtime sidecar (playwright + browsers + tesseract + skills)
        run: npm run build:runtime

      - name: Smoke test binary
        shell: bash
        run: |
          BIN="dist/${{ matrix.asset }}"
          chmod +x "$BIN" 2>/dev/null || true
          VERSION=$("$BIN" --version)
          echo "Binary version: $VERSION"
          "$BIN" discover --dry-run
          STATUS=$("$BIN" runtime status)
          echo "$STATUS"
          echo "$STATUS" | grep -q 'carrega' || {
            echo "::error::playwright não carregou no binário — runtime sidecar não está sendo resolvido"
            exit 1
          }

      - name: Stage sidecar + Tauri build + collect installer
        run: node scripts/build-desktop.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/career-ui-*

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist-release

      - name: Checksums
        run: |
          cd dist-release
          sha256sum career-ui-* > checksums.txt
          cat checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/career-ui-*
            dist-release/checksums.txt
          generate_release_notes: true
          body: |
            App desktop do CareerFacilator AI — instalador nativo que já traz a CLI embutida + `career-runtime/` (Playwright + Chromium + pdf-parse + tesseract) + `skills/`. Nenhum pré-requisito externo.

            **Instalação** — baixe o instalador do seu sistema:

            - Windows: `career-ui-windows-x64.exe` (NSIS per-user) — o SmartScreen pode avisar (binário sem assinatura): "Mais informações → Executar mesmo assim"
            - macOS: `career-ui-macos-arm64.dmg` (Apple Silicon) ou `career-ui-macos-x64.dmg` (Intel) — `xattr -dr com.apple.quarantine <app>` p/ liberar (Gatekeeper)
            - Linux: `career-ui-linux-x64.AppImage` — `chmod +x`; o Chromium embutido pode pedir libs de sistema (`npx playwright install-deps chromium` ou equivalente)

            O app sobe o mesmo dashboard local do `career ui` numa janela nativa — e na primeira abertura registra o comando `career` no PATH do seu usuário para uso direto no terminal. Detalhes: `tutorials/pt-BR/09-interface-grafica.md` / `tutorials/en/09-graphical-interface.md`.
